plugins {
    id 'java'
}

group = 'me.fokend'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

ext {
    sqliteVersion = '3.46.1.3'
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    // SQLite is resolved at runtime by Paper's library loader (see plugin.yml "libraries").
    compileOnly "org.xerial:sqlite-jdbc:${sqliteVersion}"

    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing']
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version, sqliteVersion: sqliteVersion)
    }
}

test {
    useJUnitPlatform()
    maxHeapSize = '256m'
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

jar {
    archiveBaseName = 'LivingWorld'
}
